name: Saytni joylash

# main'ga o'zgarish yuborilganda saytni Cloudflare'ga joylaydi (qonun.maksudoff.uz)
on:
  push:
    branches: [main]
    paths: ["worker/**", "d1/schema.sql", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: cloudflare

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci

      - name: D1 bazasini tayyorlash
        run: bash scripts/ensure-d1.sh

      - name: Saytni joylash
        run: npx wrangler deploy

      - name: Maxfiy kalitlarni yangilash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_SETUP_CODE: ${{ secrets.ADMIN_SETUP_CODE }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          [ -n "$ADMIN_SETUP_CODE" ] && printf '%s' "$ADMIN_SETUP_CODE" | npx wrangler secret put ADMIN_SETUP_CODE
          true
